# ================================================================================================
#  Pemplate  ·  Forge 1.12.2 mod template
#  Author the mod in Java 25, build with Gradle 9.6.1 / RetroFuturaGradle 2.0.2, and ship Java 8
#  bytecode via JVMDowngrader.  MixinBooter 11+.
# ================================================================================================

# ---- Gradle daemon / performance ---------------------------------------------------------------
# Run the Gradle daemon on JDK 25: RetroFuturaGradle 2.0.2 ships Java 25 bytecode, so the daemon JDK
# must be 25+.  Minecraft is compiled/run with a Java 8 toolchain (auto-provisioned) and the built
# mod is downgraded from Java 25 to Java 8 by JVMDowngrader.
org.gradle.jvmargs = -Xmx3G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.daemon = true
org.gradle.vfs.watch = true
# Configuration cache is intentionally OFF: RFG's runClient/runServer JavaExec tasks are not yet
# configuration-cache compatible.  parallel + caching already provide most of the speed-up.
# org.gradle.configuration-cache = false

# Let Gradle auto-provision any missing JDK toolchains (Java 8 for Minecraft, Java 25 for the mod).
org.gradle.java.installations.auto-download = true

# ---- Source / language -------------------------------------------------------------------------
# Java language version used to AUTHOR the mod.  JVMDowngrader rewrites the compiled bytecode down
# to Java 8 (Forge 1.12.2's runtime) at build time and shades in the API stubs it needs.
java_version = 25
# Convenient nullability / contract annotations (https://github.com/JetBrains/java-annotations).
use_jetbrains_annotations = false

# ---- Compilation output ------------------------------------------------------------------------
generate_sources_jar = true
generate_javadocs_jar = false

# ---- Testing -----------------------------------------------------------------------------------
enable_junit_testing = true
show_testing_output = false

# ---- Formatting (Spotless) ---------------------------------------------------------------------
# When true, Spotless (palantir-java-format) is applied and spotlessCheck runs as part of `build`
# and CI — unformatted code fails the build; run `./gradlew spotlessApply` to fix.
# Set false to disable Spotless entirely (no spotless tasks are registered, nothing is enforced).
use_spotless = true

# ---- Mod information ---------------------------------------------------------------------------
# HIGHLY recommend complying with SemVer for mod_version: https://semver.org/
mod_version = 1.0.0
root_package = com.sumirelabs
mod_id = lightbench
mod_name = Lightbench

# ---- Mod metadata (optional) -------------------------------------------------------------------
# Pull these into a generated Tags class via tags.properties (see 'Tags' below).
mod_description = Light engine benchmark harness (1.12.2 port of ca.spottedleaf/lightbench methodology)
mod_url = https://github.com/Sumire-Labs/lightbench
# A url where the mod's update json can be fetched.
# Wiki: https://docs.minecraftforge.net/en/1.12.x/gettingstarted/autoupdate/#forge-update-checker
mod_update_json =
# Delimit authors with commas.
mod_authors =  s12kuma01 (1.12.2 port)
mod_credits = Spottedleaf (original)
mod_logo_path =

# ---- Mappings ----------------------------------------------------------------------------------
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# ---- Run configurations ------------------------------------------------------------------------
# If multiple arguments/tweak classes are stated, use spaces as the delimiter.
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# ---- Maven publishing (secrets: MAVEN_USER, MAVEN_PASS) ----------------------------------------
publish_to_maven = false
maven_name = ${mod_name}
maven_url =

# ---- Publishing (CurseForge / Modrinth) -------------------------------------------------------
# release_type can only be: release, beta or alpha (applies to CurseForge / Modrinth).
release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}

# CurseForge (secret: CURSEFORGE_TOKEN).  curseforge_project_id must be the numerical id, not the slug.
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

# Modrinth (secret: MODRINTH_TOKEN with the CREATE_VERSION and PROJECT_WRITE permissions).
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# ================================================================================================
#  Refresh Gradle after changing anything below this line so everything wires up correctly.
# ================================================================================================

# ---- Modify Minecraft sources ------------------------------------------------------------------
# RFG allows Minecraft sources to be edited with the changes reflected on run (good for coremod
# previews).  Turning this on keeps the decompiled sources from regenerating.
change_minecraft_sources = false

# ---- Tags --------------------------------------------------------------------------------------
# An RFG concept akin to Ant ReplaceTokens: a class is generated at build time describing values
# that can change per build (e.g. version).  IDE-friendly — no token pollution of committed source.
# Declare tag values in tags.properties (references to other properties are allowed).
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# ---- Access Transformers -----------------------------------------------------------------------
# Change visibility of Minecraft classes/methods/fields.  AT files live in the root of
# src/main/resources named '<mod_id>_at.cfg'.  Delimit multiple locations with spaces.
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# ---- Mixins (MixinBooter 11+) ------------------------------------------------------------------
# Wiki: https://github.com/SpongePowered/Mixin/wiki + https://github.com/CleanroomMC/MixinBooter
# Only use mixins once you understand the underlying structure.
use_mixins = false
mixin_booter_version = 11.5
# Auto-generate any missing mixins.<config>.json from the mixin_configs list.  The example ships its
# config already, so this is off; set true when scaffolding brand-new configs.
generate_mixins_json = false
# Space-delimited config names (NOT full filenames).  Each maps to mixins.<name>.json.  The example
# ships one config (mixins.${mod_id}.json) holding a single vanilla-target mixin.
mixin_configs = ${mod_id}
# Refmap filename (auto-generated by RFG).  Only one name is accepted; all configs share it.
mixin_refmap = mixins.${mod_id}.refmap.json
# How MixinBooter 11 discovers your configs:
#   manifest_configs : the 'MixinConfigs' manifest attribute       (simplest, static — the default here)
#   connector_class  : an org.spongepowered.asm.mixin.connect.IMixinConnector (dynamic / conditional)
#   both             : emit both mechanisms
mixin_loading_method = manifest_configs
# Required only when mixin_loading_method is 'connector_class' or 'both'.  FQCN implementing IMixinConnector.
mixin_connector_class =

# ---- Coremods ----------------------------------------------------------------------------------
# The lowest-level way to transform classes at load time (IClassTransformer).  Powerful but sharp,
# with little documentation — only make a coremod if you are sure of what you are doing.
# Set coremod_includes_mod = false if your coremod has no @Mod class.
# coremod_plugin_class_name must implement net.minecraftforge.fml.relauncher.IFMLLoadingPlugin.
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# ---- AssetMover --------------------------------------------------------------------------------
# Download assets from official Mojang servers, CurseForge, or direct links.
# Documentation: https://github.com/CleanroomMC/AssetMover
use_asset_mover = false
asset_mover_version = 2.5
